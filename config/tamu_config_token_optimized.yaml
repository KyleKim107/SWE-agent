# TAMU LLM Configuration for SWE-agent - TOKEN OPTIMIZED VERSION
# Optimized for reduced token usage while maintaining effectiveness
#
# Key Optimizations:
# 1. Reduced max_observation_length: 100k -> 20k (saves ~80% on verbose outputs)
# 2. Added history processors to manage context window
# 3. Shorter, more focused templates
# 4. Designed for use with 1 compressed demonstration (not 2-5 full demos)
#
# Expected token savings: 70-80% compared to original config

agent:
  model:
    api_base: https://chat-api.tamu.ai/openai
    api_key: "sk-1ae2201e819648ee9f2cd58b7125efeb"
    
    completion_kwargs:
      stream: true
      custom_llm_provider: openai
    
    name: openai/protected.gpt-5
    
    temperature: 0.0
    
    per_instance_call_limit: 50
    per_instance_cost_limit: 0
    total_cost_limit: 0
    
    max_input_tokens: 256000
    
  templates:
    # Enhanced system template with explicit formatting instructions (token-optimized)
    system_template: |-
      You are a helpful software engineering assistant. You must ALWAYS follow this exact format:
      
      DISCUSSION
      [Your reasoning and planning here]
      
      ```
      [Your bash command here - keep it simple!]
      ```
      
      CRITICAL RULES:
      1. Always use EXACTLY ONE "DISCUSSION" section followed by EXACTLY ONE code block
      2. Keep bash commands SIMPLE - avoid complex heredocs, nested quotes, and excessive escaping
      3. Use str_replace_editor create command instead of heredoc for file creation
      4. SUBMIT WHEN READY: Once you have:
         - Fixed the issue in the source code
         - Verified the fix works (tests pass, reproduce script shows correct output)
         - Committed your changes (if needed)
         Then IMMEDIATELY run `submit` to finish. Do NOT repeat verification commands multiple times.
         If you see the same successful results 2-3 times, you're done - submit immediately.
    
    # Improved instance template with examples (token-optimized)
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      
      TASK: Fix the issue described in the PR below.
      
      <pr_description>
      {{problem_statement}}
      </pr_description>
      
      INSTRUCTIONS:
      1. Find and read relevant code files
      2. Create a SIMPLE reproduce script using str_replace_editor
      3. Edit the source code to fix the issue
      4. Verify the fix works
      5. SUBMIT: Once verification is successful, run `submit` immediately. Do not repeat the same verification steps.
      
      IMPORTANT FORMAT REQUIREMENTS:
      Your response must ALWAYS follow this format:
      
      DISCUSSION
      I will [explain what you're doing]. First, I'll [step 1]. Then, I'll [step 2].
      
      ```
      bash -c "cd {{working_dir}} && ls -la some/path"
      ```
      
      BASH COMMAND GUIDELINES:
      ✓ GOOD: Simple commands (ls, cat, python, str_replace_editor view)
      ✗ BAD: Complex heredocs with nested quotes
      
      Remember: Keep it simple! Use str_replace_editor for file creation.
      
      SUBMISSION GUIDELINES:
      - Submit as soon as you've verified the fix works correctly
      - If you've run the same verification command 2-3 times with the same successful result, you're done - submit
      - Do not waste API calls on repeated verification - submit when ready
    
    next_step_template: |-
      OBSERVATION:
      {{observation}}
      
      Continue following the DISCUSSION + command format.
    
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
      
      Continue with the next step in the same format.
    
    # OPTIMIZATION: Truncate observations at 20k chars instead of 100k
    # This is the BIGGEST token saver - prevents verbose outputs from bloating context
    max_observation_length: 20000
    
    next_step_truncated_observation_template: |-
      {{observation[:max_observation_length]}}
      ... [{{elided_chars}} chars truncated - use head/tail/grep for specific content]
    
    # Demonstrations will be set dynamically by run_adaptive_evaluation_fixed.py
    # Using put_demos_in_history=True with compressed demos
    put_demos_in_history: true
  
  # OPTIMIZATION: History processors to manage context window
  history_processors:
    # Keep only last N observations (classic from SWE-agent paper)
    # Older observations replaced with "[N lines omitted]"
    - type: last_n_observations
      n: 5
      # Remove verbose outputs even if recent
      always_remove_output_for_tags:
        - remove_output
        - verbose_listing
    
    # Remove duplicate file views (keeps only most recent view of each file)
    # Saves tokens when agent views same file multiple times
    - type: closed_window
    
    # Remove patterns that don't add value after initial viewing
    # Like full diff blocks in older history items
    - type: remove_regex
      remove:
        - "<diff>.*?</diff>"
      keep_last: 2  # Keep patterns in last 2 history items

  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
    
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Review your changes and submit.
          <diff>
          {{diff}}
          </diff>
    
    enable_bash_tool: true
    
    parse_function:
      type: thought_action
      # Custom error message with examples
      error_message: |-
        FORMAT ERROR! Your response must follow this EXACT format:
        
        DISCUSSION
        [Your reasoning here]
        
        ```
        [Your command here]
        ```
        
        Example:
        DISCUSSION
        I'll first check the validators file to understand the current implementation.
        
        ```
        str_replace_editor view /django__django/django/contrib/auth/validators.py
        ```

